[project]
name = "safesight-ml"
version = "0.1.0"
description = "SafeSight edge pipeline: video -> detections -> zone rules -> contract events"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pydantic>=2.9",
  "httpx>=0.27",
  "onnx>=1.17",
  "onnxruntime>=1.20",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.4", "lap>=0.5.12"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
