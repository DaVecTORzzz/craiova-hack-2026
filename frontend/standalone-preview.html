      // 1. STĂRI TEMĂ
      // Dark Mode: bg: #292929, panels: #352F6B, accent: #4034AD, text: alb
      // Light Mode: bg: #F5F5F5, panels: #B3F1B2, accent: #70ED6E, text: negru
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [currentView, setCurrentView] = useState("dashboard");
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);

      // 2. STĂRI CAMERE & INCIDENTE
      const [cameras, setCameras] = useState(INITIAL_CAMERAS);
      const [selectedCameraId, setSelectedCameraId] = useState("CAM-04");
      const [incidents, setIncidents] = useState(INITIAL_INCIDENTS);
      const [searchQuery, setSearchQuery] = useState("");
      const [severityFilter, setSeverityFilter] = useState("all");

      // 3. CAPTURI AUTOMATE
      const [capturedScreenshots, setCapturedScreenshots] = useState([
        { id: "SNAP-8901", camera: "CAM-04", title: "Bagaj Nesupravegheat 98%", time: "19:57:12", hash: "e3b0c44298fc1c149afbf4c8..." },
        { id: "SNAP-8902", camera: "CAM-03", title: "Fumat Lângă Cisterne 99%", time: "19:55:04", hash: "8f434346648f6b96df89dda9..." }
      ]);
      const [showSnapshotModal, setShowSnapshotModal] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const activeCamera = useMemo(() => {
        return cameras.find((c) => c.id === selectedCameraId) || cameras[0];
      }, [cameras, selectedCameraId]);

      const filteredIncidents = useMemo(() => {
        return incidents.filter((inc) => {
          const q = searchQuery.toLowerCase().trim();
          const matches =
            !q ||
            inc.title.toLowerCase().includes(q) ||
            inc.cameraName.toLowerCase().includes(q) ||
            inc.reasoning.toLowerCase().includes(q) ||
            inc.targetType.toLowerCase().includes(q);
          const matchesSev = severityFilter === "all" || inc.severity === severityFilter;
          return matches && matchesSev;
        });
      }, [incidents, searchQuery, severityFilter]);

      const handleAcknowledge = (id, e) => {
        if (e) e.stopPropagation();
        const item = incidents.find((i) => i.id === id);
        setIncidents((prev) => prev.filter((i) => i.id !== id));
        showToast(`Incidentul "${item?.title || id}" a fost arhivat și marcat ca REZOLVAT.`);
      };

      const handleManualCapture = () => {
        const snap = {
          id: `SNAP-${Date.now().toString().slice(-4)}`,
          camera: activeCamera.id,
          title: activeCamera.boxes[0]?.label || "Captură Live Manuală",
          time: new Date().toLocaleTimeString("ro-RO"),
          hash: Math.random().toString(36).substring(2, 12) + "..."
        };
        setCapturedScreenshots((p) => [snap, ...p]);
        showToast(`Captură automată AI înregistrată!`);
      };

      const theme = {
        appBg: isDarkMode ? "#292929" : "#F5F5F5",
        panelBg: isDarkMode ? "#352F6B" : "#B3F1B2",
        panelBorder: isDarkMode ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.08)",
        accentColor: isDarkMode ? "#4034AD" : "#70ED6E",
        textColor: isDarkMode ? "#FFFFFF" : "#0F172A",
        textMuted: isDarkMode ? "#CBD5E1" : "#334155",
        cardBg: isDarkMode ? "rgba(41, 41, 41, 0.5)" : "rgba(255, 255, 255, 0.6)",
        inputBg: isDarkMode ? "#292929" : "#FFFFFF"
      };

      const renderBox = (b) => {
        const isCrit = b.type === "critical";
        const isWarn = b.type === "warning";
        const borderColor = isCrit ? "border-red-500" : isWarn ? "border-amber-400" : "border-emerald-400";

        return (
          <div
            key={b.id}
            style={{ top: b.coords.top, left: b.coords.left, width: b.coords.width, height: b.coords.height }}
            className={`absolute border-2 ${borderColor} rounded transition-all ring-2 ring-white/20 cursor-pointer shadow-lg`}
            onClick={() => showToast(`AI Tracker: ${b.label} [${b.trackingId}]`)}
          >
            <div className={`absolute -top-6 left-0 px-2 py-0.5 rounded text-[10px] font-bold shadow ${tagBg} whitespace-nowrap`}>
              {b.label} <span className="opacity-75 font-mono text-[9px]">[{b.trackingId}]</span>
            </div>
          </div>
        );
      };

          <header style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }} className="h-16 px-4 md:px-6 flex items-center justify-between border-b sticky top-0 z-20 shadow-sm">

              </button>

              <div style={{ backgroundColor: theme.cardBg, borderColor: theme.panelBorder }} className="flex items-center gap-2 px-2.5 py-1.5 rounded-lg border">
                <div style={{ backgroundColor: theme.accentColor }} className={`w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs ${isDarkMode ? "text-white" : "text-slate-950"}`}>
                  RO
                </div>
                <div className="hidden xl:block text-left text-xs leading-tight">
                  <p className="font-bold">Ofițer Securitate</p>
                  <p style={{ color: theme.textMuted }} className="text-[10px]">Cpt. Radu M.</p>

            >

                  onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}
                  style={{ backgroundColor: theme.cardBg, borderColor: theme.panelBorder }}
                  className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg border font-semibold text-xs shadow-sm hover:opacity-80"
                >
                  <Icon name={isSidebarCollapsed ? "chevron-right" : "chevron-left"} size={17} />
                  {!isSidebarCollapsed && <span>Restrânge Meniul</span>}
                </button>
              </div>
            </aside>

            {/* VIZUALIZĂRI */}
            {currentView === "feed-fullscreen" ? (
              <div className="flex-1 flex flex-col p-4 overflow-y-auto">
                <div className="flex items-center justify-between mb-3">
                  <span className="font-bold text-sm uppercase">Perete Video Imersiv - {activeCamera.name}</span>
                  <button onClick={() => setCurrentView("dashboard")} style={{ backgroundColor: theme.accentColor }} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${isDarkMode ? "text-white" : "text-slate-950"}`}>
                    Înapoi la Dashboard
                  </button>
                </div>
                <div className="flex-1 relative rounded-xl overflow-hidden bg-black min-h-[500px]">
                  {activeCamera.status === "offline" ? (
                    <div className="w-full h-full flex flex-col items-center justify-center text-red-500 font-mono font-bold text-2xl">
                      SEMNAL PIERDUT (CAMERA OFFLINE)
                    </div>
                  ) : (
                    <div className={`w-full h-full bg-gradient-to-br ${activeCamera.previewBg} relative flex items-center justify-center`}>
                      <span className="text-white/40 font-mono text-xl">{activeCamera.name} (FULLSCREEN)</span>
                      {activeCamera.boxes.map(renderBox)}
                    </div>
                  )}
                </div>
              </div>
            ) : currentView === "feed-split" ? (
              <div className="flex-1 flex flex-col p-4 space-y-4 overflow-y-auto">
                <div style={{ backgroundColor: theme.panelBg }} className="h-[48%] rounded-xl p-3 flex flex-col border">
                  <span className="font-bold text-xs uppercase mb-2">Feed Superior: {activeCamera.name}</span>
                  <div className="flex-1 relative rounded-lg overflow-hidden bg-black">
                    {activeCamera.status === "offline" ? (
                      <div className="w-full h-full flex items-center justify-center text-red-500 font-bold font-mono">SEMNAL PIERDUT</div>
                    ) : (
                      <div className={`w-full h-full bg-gradient-to-br ${activeCamera.previewBg} relative flex items-center justify-center`}>
                        <span className="text-white/30 font-mono">{activeCamera.name}</span>
                        {activeCamera.boxes.map(renderBox)}
                      </div>
                    )}
                  </div>
                </div>

                <div style={{ backgroundColor: theme.panelBg }} className="flex-1 rounded-xl p-3 border overflow-y-auto">
                  <span className="font-bold text-xs uppercase mb-2 block">Probleme & Telemetrie Inferioară ({filteredIncidents.length})</span>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {filteredIncidents.map((inc) => (
                      <div key={inc.id} style={{ backgroundColor: theme.cardBg }} className="p-3 rounded-lg border border-white/10 text-xs space-y-1">
                        <div className="flex justify-between font-bold">
                          <span>{inc.title}</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-red-600 text-white uppercase">{inc.severity}</span>
                        </div>
                        <p style={{ color: theme.textMuted }} className="text-[11px]">{inc.reasoning}</p>
                        <div className="flex justify-between pt-1 font-mono text-[10px]">
                          <span>{inc.detectedAt}</span>
                          <button onClick={(e) => handleAcknowledge(inc.id, e)} className="text-emerald-400 font-bold underline">Rezolvă</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : currentView === "analytics" ? (
              <div className="flex-1 p-6 space-y-4 overflow-y-auto">
                <h2 className="text-xl font-bold uppercase">Statistici Siguranță AI & Audit</h2>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div style={{ backgroundColor: theme.panelBg }} className="p-4 rounded-xl border">
                    <p className="text-xs opacity-75">Timp Mediu Răspuns (MTTR)</p>
                    <p className="text-2xl font-mono font-bold text-emerald-400">42 sec</p>
                  </div>
                  <div style={{ backgroundColor: theme.panelBg }} className="p-4 rounded-xl border">
                    <p className="text-xs opacity-75">Acuratețe Detecție AI</p>
                    <p className="text-2xl font-mono font-bold text-indigo-400">97.8%</p>
                  </div>
                  <div style={{ backgroundColor: theme.panelBg }} className="p-4 rounded-xl border">
                    <p className="text-xs opacity-75">FOD Detectat pe Piste</p>
                    <p className="text-2xl font-mono font-bold text-amber-400">14 Obiecte</p>
                  </div>
                </div>
              </div>
            ) : (
              /* DASHBOARD 4 ZONE */
              <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
                {/* ZONA CENTRALĂ: FEED + THUMBNAILS */}
                <main className="flex-1 flex flex-col p-3 md:p-4 overflow-y-auto space-y-3">
                  {/* VIDEO PLAYER MARE */}
                  <div style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }} className="rounded-xl border p-3 flex flex-col shadow-lg flex-1 min-h-[360px]">
                    <div className="flex items-center justify-between pb-2 mb-2 border-b border-white/10">
                      <div className="flex items-center gap-2">
                        <span className={`w-3 h-3 rounded-full ${activeCamera.status === "online" ? "bg-emerald-500 animate-pulse" : "bg-red-500"}`}></span>
                        <span className="font-bold text-sm">{activeCamera.id} - {activeCamera.name}</span>
                        <span style={{ backgroundColor: theme.cardBg }} className="text-[10px] font-mono px-2 py-0.5 rounded hidden sm:inline">{activeCamera.zone}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={handleManualCapture} style={{ backgroundColor: theme.accentColor }} className={`px-2.5 py-1 rounded text-xs font-bold flex items-center gap-1 ${isDarkMode ? "text-white" : "text-slate-950"}`}>
                          <Icon name="camera" size={13} /> <span>Captură</span>
                        </button>
                        <button onClick={() => setCurrentView("feed-fullscreen")} style={{ backgroundColor: theme.cardBg }} className="p-1.5 rounded border border-white/10">
                          <Icon name="maximize-2" size={14} />
                        </button>
                      </div>
                    </div>

                    {/* ECRAN VIDEO SAU SEMNAL PIERDUT */}
                    <div className="flex-1 relative rounded-lg overflow-hidden bg-black border border-slate-700 flex items-center justify-center">
                      {activeCamera.status === "offline" ? (
                        <div className="w-full h-full flex flex-col items-center justify-center text-center p-6 bg-zinc-950 text-white">
                          <Icon name="wifi-off" size={40} className="text-red-500 mb-2 animate-bounce" />
                          <h2 className="text-2xl font-black text-red-500 font-mono tracking-widest">SEMNAL PIERDUT</h2>
                          <p className="text-xs text-slate-400 font-mono mt-1">CAMERA {activeCamera.id} ESTE MOMENTAN OFFLINE</p>
                        </div>
                      ) : (
                        <div className={`w-full h-full bg-gradient-to-br ${activeCamera.previewBg} relative flex items-center justify-center`}>
                          <div className="text-center opacity-40">
                            <Icon name="plane" size={70} className="mx-auto mb-2 text-slate-300" />
                            <p className="font-mono font-bold text-white text-base">{activeCamera.name.toUpperCase()}</p>
                            <p className="font-mono text-xs text-slate-300">AI REAL-TIME VISION INFERENCE</p>
                          </div>
                          {activeCamera.boxes.map(renderBox)}

                          <div className="absolute top-3 left-3 flex items-center gap-2 bg-black/70 px-2 py-1 rounded text-[10px] font-mono text-white">
                            <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                            <span>REC: LIVE</span>
                            <span>|</span>
                            <span>{activeCamera.resolution}</span>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* MINIATURI CAMERE JOS */}
                  <div style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }} className="rounded-xl border p-3 shadow-md">
                    <div className="flex items-center justify-between mb-2">
                      <span className="font-bold text-xs uppercase tracking-wide">Rețeaua CCTV Aeroport ({cameras.length})</span>
                      <span style={{ color: theme.textMuted }} className="text-[10px]">Click pe miniatură pentru schimbare cameră</span>
                    </div>

                    <div className="flex gap-2 overflow-x-auto pb-1">
                      {cameras.map((c) => {
                        const isSel = c.id === activeCamera.id;
                        const isOff = c.status === "offline";
                        return (
                          <button
                            key={c.id}
                            onClick={() => setSelectedCameraId(c.id)}
                            style={{ borderColor: isSel ? theme.accentColor : theme.panelBorder, backgroundColor: isSel ? theme.cardBg : "rgba(0,0,0,0.15)" }}
                            className={`min-w-[140px] p-2 rounded-lg border-2 text-left shrink-0 transition-transform hover:scale-105 ${isSel ? "ring-2 ring-indigo-400/50" : ""}`}
                          >
                            <div className={`h-14 rounded flex items-center justify-center bg-gradient-to-br ${c.previewBg} mb-1 relative`}>
                              {isOff ? (
                                <span className="text-[10px] text-red-400 font-mono font-bold">OFFLINE</span>
                              ) : (
                                <Icon name="video" size={16} className="text-slate-300 opacity-60" />
                              )}
                              <span className={`absolute top-1 left-1 w-2 h-2 rounded-full ${isOff ? "bg-red-500" : "bg-emerald-400"}`}></span>
                            </div>
                            <p className="font-bold text-xs truncate">{c.name}</p>
                            <p style={{ color: theme.textMuted }} className="text-[9px] font-mono">{c.id} • {c.status.toUpperCase()}</p>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </main>

                {/* SIDEBAR DREAPTA: INCIDENTE & XAI */}
                <aside style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }} className="w-full lg:w-96 border-t lg:border-t-0 lg:border-l p-3 md:p-4 flex flex-col shrink-0 overflow-hidden shadow-lg">
                  <div className="flex items-center justify-between pb-3 border-b border-white/10">
                    <div>
                      <h2 className="font-bold text-sm uppercase">Alerte Incidente AI</h2>
                      <p style={{ color: theme.textMuted }} className="text-[10px]">Explainable AI & Live Tracking</p>
                    </div>
                    <span style={{ backgroundColor: theme.accentColor }} className={`text-xs font-black px-2 py-0.5 rounded-full ${isDarkMode ? "text-white" : "text-slate-950"}`}>
                      {filteredIncidents.length}
                    </span>
                  </div>

                  {/* FILTRE RAPIDE */}
                  <div className="flex gap-1 my-2">
                    {["all", "critical", "warning", "resolved"].map((k) => (
                      <button
                        key={k}
                        onClick={() => setSeverityFilter(k)}
                        style={{ backgroundColor: severityFilter === k ? theme.accentColor : theme.cardBg, color: severityFilter === k && !isDarkMode ? "#0F172A" : theme.textColor }}
                        className="flex-1 py-1 text-[10px] font-bold rounded"
                      >
                        {k === "all" ? "Toate" : k === "critical" ? "Critice" : k === "warning" ? "Avertiz." : "Rezolv."}
                      </button>
                    ))}
                  </div>

                  {/* LISTĂ CARDURI INCIDENTE */}
                  <div className="flex-1 overflow-y-auto space-y-2.5 pr-1">
                    {filteredIncidents.length === 0 ? (
                      <div style={{ backgroundColor: theme.cardBg }} className="p-4 rounded-xl text-center space-y-2 mt-4">
                        <Icon name="check-circle-2" size={30} className="mx-auto text-emerald-400" />
                        <p className="font-bold text-xs">Toate incidentele au fost soluționate!</p>
                      </div>
                    ) : (
                      filteredIncidents.map((inc) => {
                        const isCrit = inc.severity === "critical";
                        const isWarn = inc.severity === "warning";

                        return (
                          <div
                            key={inc.id}
                            style={{ backgroundColor: theme.cardBg, borderColor: isCrit ? "rgba(239,68,68,0.4)" : isWarn ? "rgba(245,158,11,0.4)" : "rgba(16,185,129,0.4)" }}
                            className="rounded-xl border p-3 space-y-2 text-xs"
                          >
                            <div className="flex justify-between items-start gap-1">
                              <div>
                                <span className={`text-[9px] font-black uppercase px-1.5 py-0.5 rounded ${isCrit ? "bg-red-600 text-white" : isWarn ? "bg-amber-500 text-slate-900" : "bg-emerald-600 text-white"}`}>
                                  {isCrit ? "PERICOL IMINENT" : isWarn ? "AVERTISMENT" : "REMEDIAT"}
                                </span>
                                <h3 className="font-bold text-xs mt-1">{inc.title}</h3>
                              </div>
                              <button onClick={() => setSelectedCameraId(inc.cameraId)} className="text-[10px] font-mono px-1.5 py-0.5 rounded border border-white/20">
                                {inc.cameraId}
                              </button>
                            </div>

                            <p style={{ color: theme.textMuted }} className="text-[10px] font-mono">{inc.cameraName} • {inc.detectedAt}</p>

                            {/* CONFIDENCE SCORE CU GRADIENT ROȘU - PORTOCALIU - VERDE */}
                            <div className="space-y-1">
                              <div className="flex justify-between text-[10px]">
                                <span className="font-semibold">Confidence Score:</span>
                                <span className="font-mono font-bold">{inc.confidence}%</span>
                              </div>
                              <div className="w-full h-2 rounded-full overflow-hidden bg-black/30 relative">
                                <div className="absolute inset-0 bg-gradient-to-r from-red-600 via-amber-400 to-emerald-500 opacity-25"></div>
                                <div
                                  style={{ width: `${inc.confidence}%` }}
                                  className="h-full bg-gradient-to-r from-red-600 via-amber-400 to-emerald-500 rounded-full transition-all"
                                ></div>
                              </div>
                            </div>

                            {/* EXPLAINABLE AI (REASONING) */}
                            <div style={{ backgroundColor: isDarkMode ? "rgba(0,0,0,0.3)" : "rgba(255,255,255,0.7)" }} className="p-2 rounded text-[11px] space-y-1 border border-white/5">
                              <p className="font-bold text-indigo-400 text-[10px]">AI Reasoning:</p>
                              <p style={{ color: theme.textMuted }} className="leading-snug">{inc.reasoning}</p>
                            </div>

                            <div className="flex justify-between items-center pt-1">
                              <span className="text-[9px] text-slate-400 font-mono">Snap: {inc.snapshotId}</span>
                              <button
                                onClick={(e) => handleAcknowledge(inc.id, e)}
                                style={{ backgroundColor: isDarkMode ? "#4034AD" : "#70ED6E", color: isDarkMode ? "#FFFFFF" : "#0F172A" }}
                                className="px-3 py-1 rounded text-xs font-bold hover:opacity-90"
                              >
                                Marchează Rezolvat
                              </button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </aside>
              </div>
            )}
          </div>

          {/* MODAL CAPTURI AUTOMATE */}
          {showSnapshotModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div style={{ backgroundColor: theme.panelBg, color: theme.textColor }} className="w-full max-w-xl rounded-2xl p-5 border border-white/10 space-y-4">
                <div className="flex justify-between items-center border-b border-white/10 pb-2">
                  <h3 className="font-bold text-sm uppercase">Capturi Automate Generate de AI (Evidence)</h3>
                  <button onClick={() => setShowSnapshotModal(false)} className="text-lg font-bold">✕</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-80 overflow-y-auto">
                  {capturedScreenshots.map((s) => (
                    <div key={s.id} style={{ backgroundColor: theme.cardBg }} className="p-3 rounded-xl border border-white/10 space-y-1 text-xs">
                      <p className="font-bold">{s.title}</p>
                      <p style={{ color: theme.textMuted }} className="font-mono text-[10px]">{s.camera} • {s.time}</p>
                      <p className="font-mono text-[9px] opacity-60">SHA-256: {s.hash}</p>
                    </div>
                  ))}
                </div>
                <div className="flex justify-end">
                  <button onClick={() => setShowSnapshotModal(false)} style={{ backgroundColor: theme.accentColor }} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${isDarkMode ? "text-white" : "text-slate-950"}`}>
                    Închide
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICARE */}
          {toastMessage && (
            <div className="fixed bottom-4 right-4 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl border border-indigo-400 text-xs shadow-2xl animate-fade-in font-medium">
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
