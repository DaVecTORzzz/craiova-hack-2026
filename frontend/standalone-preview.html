<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeSight - Management condiții siguranță</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }
  </style>
</head>
<body class="bg-[#121212] text-slate-100 overflow-hidden font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    function Icon({ name, size = 18, className = "" }) {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block shrink-0 ${className}`}></i>;
    }

    const AVAILABLE_OPERATORS = [
      { id: 'ariana', name: 'Ariana V.', role: 'Dispatcher Principal (Lead)', badge: 'AIRSIDE-LEAD' },
      { id: 'mihai', name: 'Mihai D.', role: 'Șef Tură Rampă & Apron', badge: 'RAMP-CHIEF' },
      { id: 'radu', name: 'Radu P.', role: 'Inspector Siguranță Sol', badge: 'SAFETY-INSP' }
    ];

    const INITIAL_CAMERAS = [
      {
        id: "stand12",
        code: "CAM-01",
        name: "CAM-01 • Stand 12 Avion B777",
        subtitle: "Alimentare & Întreținere (Zonă Motor Apron)",
        category: "Alimentare & Rampă",
        status: "online",
        engine_on: true,
        fps: 30,
        resolution: "4K (3840x2160)",
        previewBg: "from-blue-950 via-slate-900 to-indigo-950",
        boxes: [
          {
            id: "b1",
            label: "Persoană în Zonă Motor",
            type: "critical",
            coords: { top: "34%", left: "54%", width: "20%", height: "42%" },
            details: "Persoană detectată lângă admisie cu motorul pornit (1.4s)"
          }
        ]
      },
      {
        id: "runway08",
        code: "CAM-02",
        name: "CAM-02 • Pista 08R Runway",
        subtitle: "Cale de Rulare & Axa Centrală Decolare",
        category: "Pistă & Căi Rulare",
        status: "online",
        engine_on: false,
        fps: 60,
        resolution: "4K 60FPS",
        previewBg: "from-zinc-900 to-neutral-800",
        boxes: [
          {
            id: "b2",
            label: "FOD Metalic pe Punct Rulare",
            type: "critical",
            coords: { top: "58%", left: "38%", width: "22%", height: "18%" },
            details: "Fragment metalic nespecificat ~14cm pe axul pistei"
          }
        ]
      },
      {
        id: "gate4b",
        code: "CAM-03",
        name: "CAM-03 • Terminal 1 - Poarta 4B",
        subtitle: "Zonă Îmbarcare Pasageri & Finger",
        category: "Terminal & Porți",
        status: "online",
        engine_on: false,
        fps: 30,
        resolution: "1080p 30FPS",
        previewBg: "from-slate-900 to-indigo-950",
        boxes: [
          {
            id: "b3",
            label: "Aglomerație 3.8 p/m²",
            type: "warning",
            coords: { top: "35%", left: "48%", width: "24%", height: "38%" },
            details: "Formare bottleneck la scanare bilete"
          }
        ]
      },
      {
        id: "checkin_t1",
        code: "CAM-04",
        name: "CAM-04 • Terminal Plecări",
        subtitle: "Hol Public & Ghișee Check-In",
        category: "Terminal & Porți",
        status: "online",
        engine_on: false,
        fps: 30,
        resolution: "4K (3840x2160)",
        previewBg: "from-slate-900 to-purple-950",
        boxes: [
          {
            id: "b4",
            label: "Bagaj Abandonat #991",
            type: "critical",
            coords: { top: "52%", left: "44%", width: "20%", height: "28%" },
            details: "Valiză statică nesupravegheată >10min"
          }
        ]
      },
      {
        id: "baggage_south",
        code: "CAM-05",
        name: "CAM-05 • Rampă Sud",
        subtitle: "Triere & Manipulare Bagaje Cală",
        category: "Alimentare & Rampă",
        status: "offline",
        engine_on: false,
        fps: 0,
        resolution: "Semnal Nedisponibil",
        previewBg: "from-neutral-900 to-black",
        boxes: []
      }
    ];

    const INITIAL_INCIDENTS = [
      {
        id: "INC-8812",
        title: "Personal în zonă de aspirație turbină",
        severity: "critical",
        cameraId: "stand12",
        cameraName: "CAM-01 • Stand 12",
        detectedAt: "10:42:13",
        confidence: 94,
        confidenceCadre: "0.94 · 14/15 cadre",
        reasoning: "Persoană detectată la mai puțin de 5m de admisia motorului GE90 în timp ce motorul este activ.",
        actionSuggested: "Opriți activitatea la Stand 12 și contactați tehnicianul prin radio.",
        status: "open"
      },
      {
        id: "INC-8813",
        title: "FOD Metalic pe Axa Pistei 08R",
        severity: "critical",
        cameraId: "runway08",
        cameraName: "CAM-02 • Pista 08R",
        detectedAt: "10:38:15",
        confidence: 96,
        confidenceCadre: "0.96 · 15/15 cadre",
        reasoning: "Fragment reflectorizant static de 14cm identificat prin diferențiere față de cadrul curat de referință.",
        actionSuggested: "Blocați autorizările de decolare și trimiteți vehiculul FOD sweeper.",
        status: "open"
      },
      {
        id: "INC-8814",
        title: "Aglomerație critică la scanare bilete",
        severity: "warning",
        cameraId: "gate4b",
        cameraName: "CAM-03 • Poarta 4B",
        detectedAt: "10:34:00",
        confidence: 78,
        confidenceCadre: "0.78 · 12/15 cadre",
        reasoning: "Densitate pasageri depășește pragul de 3.5 persoane/m² în zona de acces finger.",
        actionSuggested: "Deschideți ghișeul secundar 4C pentru descongestionare.",
        status: "open"
      },
      {
        id: "INC-8815",
        title: "Bagaj abandonat nesupravegheat",
        severity: "critical",
        cameraId: "checkin_t1",
        cameraName: "CAM-04 • Check-In",
        detectedAt: "10:25:12",
        confidence: 98,
        confidenceCadre: "0.98 · 15/15 cadre",
        reasoning: "Obiect static fără proprietar pe o rază de 3.5m timp de peste 10 minute.",
        actionSuggested: "Izolați perimetrul și apelați patrula pirotehnică a aeroportului.",
        status: "open"
      }
    ];

    function App() {
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCameraId, setSelectedCameraId] = useState("stand12");
      const [cameras, setCameras] = useState(INITIAL_CAMERAS);
      const [incidents, setIncidents] = useState(INITIAL_INCIDENTS);
      const [activeOperator, setActiveOperator] = useState(AVAILABLE_OPERATORS[0]);
      const [showUserDropdown, setShowUserDropdown] = useState(false);
      const [displayMode, setDisplayMode] = useState("standard"); // 'standard' | 'split' | 'fullscreen'
      const [filterSeverity, setFilterSeverity] = useState("all");

      const activeCamera = useMemo(() => {
        return cameras.find(c => c.id === selectedCameraId) || cameras[0];
      }, [cameras, selectedCameraId]);

      const isOffline = activeCamera.status === "offline";

      // Toggle stare motor
      const toggleEngine = (camId) => {
        setCameras(prev => prev.map(c => c.id === camId ? { ...c, engine_on: !c.engine_on } : c));
      };

      // Acknowledge incident
      const handleAcknowledge = (incId) => {
        setIncidents(prev => prev.filter(i => i.id !== incId));
      };

      // Filtrare incidente după bara de căutare
      const filteredIncidents = useMemo(() => {
        return incidents.filter(inc => {
          const q = searchQuery.toLowerCase().trim();
          const matchesSearch = !q ||
            inc.title.toLowerCase().includes(q) ||
            inc.reasoning.toLowerCase().includes(q) ||
            inc.cameraName.toLowerCase().includes(q) ||
            inc.id.toLowerCase().includes(q);

          let matchesFilter = true;
          if (filterSeverity === 'critical') matchesFilter = inc.severity === 'critical';
          if (filterSeverity === 'warning') matchesFilter = inc.severity === 'warning';

          return matchesSearch && matchesFilter;
        });
      }, [incidents, searchQuery, filterSeverity]);

      // Categorisire camere
      const categorizedCameras = useMemo(() => {
        const groups = {
          'Terminal & Porți': [],
          'Pistă & Căi Rulare': [],
          'Alimentare & Rampă': []
        };
        cameras.forEach(c => {
          const cat = c.category || 'Alimentare & Rampă';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(c);
        });
        return groups;
      }, [cameras]);

      // Paleta Neutră Conform Specificațiilor Industriale:
      // Dark Mode: Fundal #121212, Panouri #1A1F2C, Bleumarin #0A1128
      // Light Mode: Fundal #F5F5F5, Panouri #FFFFFF, Bleumarin #0D47A1
      const theme = {
        appBg: isDarkMode ? "#121212" : "#F5F5F5",
        panelBg: isDarkMode ? "#1A1F2C" : "#FFFFFF",
        panelBorder: isDarkMode ? "rgba(255, 255, 255, 0.08)" : "#E2E8F0",
        navBg: isDarkMode ? "#0A1128" : "#0D47A1",
        textColor: isDarkMode ? "#F8FAFC" : "#212121",
        textMuted: isDarkMode ? "#94A3B8" : "#616161",
        cardBg: isDarkMode ? "#1E2433" : "#FFFFFF"
      };

      // Mod Full-Screen
      if (displayMode === 'fullscreen') {
        return (
          <div className="fixed inset-0 z-50 bg-black flex flex-col select-none">
            <div className="h-14 bg-black/90 px-6 flex items-center justify-between border-b border-white/10">
              <div className="flex items-center gap-3 text-white">
                <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
                <div>
                  <h2 className="font-bold text-sm">{activeCamera.name}</h2>
                  <p className="text-[11px] text-slate-400">{activeCamera.subtitle} • {activeCamera.resolution}</p>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => toggleEngine(activeCamera.id)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-mono font-bold flex items-center gap-1.5 ${
                    activeCamera.engine_on ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'
                  }`}
                >
                  <Icon name="power" size={13} />
                  MOTOR: {activeCamera.engine_on ? 'ON' : 'OFF'}
                </button>
                <button
                  onClick={() => setDisplayMode('standard')}
                  className="px-3.5 py-1.5 rounded-xl bg-white/20 hover:bg-white/30 text-white text-xs font-bold flex items-center gap-1.5"
                >
                  <Icon name="minimize-2" size={14} />
                  <span>Ieșire Full-Screen</span>
                </button>
              </div>
            </div>
            <div className="flex-1 relative flex items-center justify-center bg-black overflow-hidden">
              {isOffline ? (
                <div className="text-center p-8 text-red-500 font-mono">
                  <Icon name="wifi-off" size={56} className="mx-auto mb-3" />
                  <h3 className="text-3xl font-black tracking-widest">SEMNAL PIERDUT</h3>
                </div>
              ) : (
                <div className={`w-full h-full bg-gradient-to-br ${activeCamera.previewBg} relative flex items-center justify-center`}>
                  <div className="text-center opacity-30">
                    <Icon name="video" size={80} className="mx-auto mb-2 text-slate-300" />
                    <p className="font-mono font-bold text-white text-xl">{activeCamera.name}</p>
                  </div>
                  {activeCamera.boxes.map(box => (
                    <div
                      key={box.id}
                      style={{ top: box.coords.top, left: box.coords.left, width: box.coords.width, height: box.coords.height }}
                      className="absolute border-2 border-red-500 bg-red-500/15 rounded flex flex-col justify-between p-1.5"
                    >
                      <span className="bg-red-600 text-white font-mono text-[10px] font-bold px-1.5 py-0.5 rounded shadow self-start">
                        {box.label}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      return (
        <div style={{ backgroundColor: theme.appBg, color: theme.textColor }} className="h-screen w-screen flex flex-col overflow-hidden select-none">
          {/* 1. HEADER (Bleumarin autoritar, Titlu SafeSight, fără iconiță Live lângă titlu) */}
          <header style={{ backgroundColor: theme.navBg }} className="h-16 px-4 md:px-6 flex items-center justify-between shadow-md z-30 shrink-0 text-white">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow border border-white/20">
                <Icon name="shield" size={22} />
              </div>
              <div>
                <h1 className="font-black text-xl tracking-tight leading-none uppercase">SafeSight</h1>
                <p className="text-xs font-medium text-blue-100/90 tracking-wide mt-0.5">Management condiții siguranță</p>
              </div>
            </div>

            {/* Bara de Căutare (Placeholder simplu: "Cauta incidente") */}
            <div className="flex-1 max-w-sm mx-4 hidden sm:block">
              <div className="relative">
                <Icon name="search" size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Cauta incidente"
                  className="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-white/10 hover:bg-white/15 focus:bg-white/20 border border-white/20 text-white placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all shadow-inner"
                />
              </div>
            </div>

            {/* Controale Header: Toggle Teme & Selector User */}
            <div className="flex items-center gap-2 md:gap-3">
              <button
                onClick={() => setIsDarkMode(!isDarkMode)}
                className="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/20 transition-all shadow-sm flex items-center gap-1.5 text-xs font-bold"
                title={isDarkMode ? 'Comută pe Light Mode' : 'Comută pe Dark Mode'}
              >
                <Icon name={isDarkMode ? 'sun' : 'moon'} size={15} />
                <span className="hidden md:inline">{isDarkMode ? 'Light' : 'Dark'}</span>
              </button>

              {/* Selector Profil Operator */}
              <div className="relative">
                <button
                  onClick={() => setShowUserDropdown(!showUserDropdown)}
                  className="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 text-white text-xs transition-colors"
                >
                  <div className="w-7 h-7 rounded-lg bg-blue-500 font-bold flex items-center justify-center text-xs shadow-inner">
                    {activeOperator.name[0]}
                  </div>
                  <div className="hidden lg:block text-left leading-tight">
                    <p className="font-bold flex items-center gap-1">
                      <span>{activeOperator.name}</span>
                      <Icon name="chevron-down" size={11} className="opacity-70" />
                    </p>
                    <p className="text-[10px] text-blue-200">{activeOperator.badge}</p>
                  </div>
                </button>

                {showUserDropdown && (
                  <div
                    style={{ backgroundColor: isDarkMode ? '#1E2433' : '#FFFFFF', color: isDarkMode ? '#F8FAFC' : '#212121' }}
                    className="absolute right-0 mt-2 w-60 rounded-xl border border-slate-500/20 p-2 shadow-2xl space-y-1 text-xs z-50"
                  >
                    <div className="px-2 py-1 text-[10px] font-bold uppercase text-slate-400 border-b pb-1">
                      Selectare Operator Activ
                    </div>
                    {AVAILABLE_OPERATORS.map(op => (
                      <button
                        key={op.id}
                        onClick={() => {
                          setActiveOperator(op);
                          setShowUserDropdown(false);
                        }}
                        className={`w-full text-left px-2.5 py-1.5 rounded-lg flex items-center justify-between ${
                          op.id === activeOperator.id ? 'bg-blue-600 text-white font-bold' : 'hover:bg-slate-500/10'
                        }`}
                      >
                        <div>
                          <p className="font-semibold text-xs leading-none">{op.name}</p>
                          <p className="text-[10px] opacity-75 mt-0.5">{op.role}</p>
                        </div>
                        {op.id === activeOperator.id && <Icon name="check" size={13} />}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* 2. CORP PRINCIPAL */}
          <div className="flex-1 flex overflow-hidden">
            {/* SIDEBAR STÂNGA (Collapsible, fără cuvântul NAV când e restrâns, feed-uri pe zone) */}
            <aside
              style={{
                backgroundColor: isDarkMode ? '#141A28' : '#FFFFFF',
                borderColor: theme.panelBorder,
                width: isSidebarCollapsed ? '4.25rem' : '16rem'
              }}
              className="flex flex-col justify-between border-r transition-all duration-300 z-20 shrink-0 h-full overflow-hidden shadow-sm"
            >
              <div className="flex-1 py-3 px-2 space-y-4 overflow-y-auto">
                <div className="space-y-1">
                  {!isSidebarCollapsed && (
                    <div className="px-3 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">
                      Module Operaționale
                    </div>
                  )}
                  {[
                    { id: 'dashboard', label: 'Dashboard & Monitorizare', subtitle: 'Live Camere & Alerte', icon: 'video', active: true },
                    { id: 'incidents', label: 'Incidente & XAI', subtitle: 'Analiză Causală', icon: 'alert-octagon' },
                    { id: 'zones', label: 'Configurare Zone', subtitle: 'Poligoane & FOD', icon: 'pen-tool' },
                    { id: 'reports', label: 'Rapoarte Tură', subtitle: 'Statistici & Audit', icon: 'file-text' },
                    { id: 'settings', label: 'Edge & Setări', subtitle: 'Parametri AI Sol', icon: 'settings' }
                  ].map(m => (
                    <button
                      key={m.id}
                      style={{
                        backgroundColor: m.active ? '#1976D2' : 'transparent',
                        color: m.active ? '#FFFFFF' : (isDarkMode ? '#F8FAFC' : '#212121')
                      }}
                      className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs md:text-sm font-semibold transition-all hover:bg-slate-500/10 text-left"
                      title={m.label}
                    >
                      <Icon name={m.icon} size={18} />
                      {!isSidebarCollapsed && (
                        <div className="truncate flex-1">
                          <span className="block leading-tight truncate">{m.label}</span>
                          <span className={`text-[10px] truncate block ${m.active ? 'text-blue-100' : 'text-slate-400'}`}>{m.subtitle}</span>
                        </div>
                      )}
                    </button>
                  ))}
                </div>

                {/* Feed-uri categorisite pe zone aeroportuare */}
                {!isSidebarCollapsed && (
                  <div className="pt-2 border-t border-slate-500/15 space-y-3">
                    <div className="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400">
                      Zone & Feed-uri CCTV
                    </div>
                    {Object.entries(categorizedCameras).map(([catName, camList]) => (
                      <div key={catName} className="space-y-1">
                        <div className="px-3 text-[11px] font-bold text-slate-500 dark:text-slate-400">
                          {catName}
                        </div>
                        <div className="space-y-0.5 pl-2">
                          {camList.map(c => {
                            const isCamActive = c.id === selectedCameraId;
                            return (
                              <button
                                key={c.id}
                                onClick={() => setSelectedCameraId(c.id)}
                                className={`w-full text-left px-2.5 py-1.5 rounded-lg text-xs transition-all flex flex-col ${
                                  isCamActive
                                    ? 'bg-blue-500/15 text-blue-600 dark:text-blue-400 font-bold border-l-2 border-blue-500'
                                    : 'hover:bg-slate-500/10 text-slate-700 dark:text-slate-300'
                                }`}
                              >
                                <div className="flex items-center justify-between w-full">
                                  <span className="truncate text-[11px] font-semibold">{c.name}</span>
                                  <span className={`w-1.5 h-1.5 rounded-full ${c.status === 'offline' ? 'bg-red-500' : 'bg-emerald-500'}`}></span>
                                </div>
                                <span className="text-[10px] text-slate-400 font-normal truncate mt-0.5">{c.subtitle}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Buton Minimizare FĂRĂ textul NAV */}
              <div className="p-2.5 border-t border-slate-500/15 shrink-0">
                <button
                  onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)}
                  className="w-full flex items-center justify-center gap-2 py-2 px-2 rounded-xl bg-slate-500/10 hover:bg-slate-500/20 text-slate-700 dark:text-slate-200 text-xs font-semibold"
                  title={isSidebarCollapsed ? 'Extinde meniu' : 'Restrânge meniu'}
                >
                  <Icon name={isSidebarCollapsed ? 'chevron-right' : 'chevron-left'} size={16} />
                  {!isSidebarCollapsed && <span>Restrânge meniu</span>}
                </button>
              </div>
            </aside>

            {/* ZONA CENTRALĂ & SIDEBAR DREAPTA */}
            <main className="flex-1 flex flex-col p-3 md:p-4 overflow-y-auto space-y-3">
              {/* 4 KPI Cards */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 shrink-0">
                <div style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }} className="p-3 rounded-xl border shadow-sm flex items-center justify-between">
                  <div>
                    <p style={{ color: theme.textMuted }} className="text-[11px] font-semibold">Conformitate PPE Sol</p>
                    <p className="text-xl md:text-2xl font-black font-mono text-emerald-600 dark:text-emerald-400">94.2%</p>
                  </div>
                  <div className="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-600">
                    <Icon name="hard-hat" size={22} />
                  </div>
                </div>

                <div style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }} className="p-3 rounded-xl border shadow-sm flex items-center justify-between">
                  <div>
                    <p style={{ color: theme.textMuted }} className="text-[11px] font-semibold">Incidente Deschise</p>
                    <p className="text-xl md:text-2xl font-black font-mono text-amber-500">{filteredIncidents.length}</p>
                  </div>
                  <div className="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-500">
                    <Icon name="alert-triangle" size={22} />
                  </div>
                </div>

                <div style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }} className="p-3 rounded-xl border shadow-sm flex items-center justify-between">
                  <div>
                    <p style={{ color: theme.textMuted }} className="text-[11px] font-semibold">Latență Detecție AI</p>
                    <p className="text-xl md:text-2xl font-black font-mono text-blue-600 dark:text-blue-400">1.8s</p>
                  </div>
                  <div className="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-600">
                    <Icon name="clock" size={22} />
                  </div>
                </div>

                <div style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }} className="p-3 rounded-xl border shadow-sm flex items-center justify-between">
                  <div>
                    <p style={{ color: theme.textMuted }} className="text-[11px] font-semibold">Stare Conexiune Edge</p>
                    <p className="text-xl md:text-2xl font-black font-mono text-emerald-600 dark:text-emerald-400">ONLINE</p>
                  </div>
                  <div className="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-600">
                    <Icon name="wifi" size={22} />
                  </div>
                </div>
              </div>

              {/* Feed Video & Incidente */}
              <div className={`flex-1 flex ${displayMode === 'split' ? 'flex-col' : 'flex-col lg:flex-row'} gap-3 overflow-hidden`}>
                {/* Partea Video (Restrânsă ergonomic la max 320px) */}
                <div className="flex-1 flex flex-col space-y-2 min-w-0">
                  <div style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }} className="p-2 rounded-xl border shadow-sm flex items-center justify-between gap-2 shrink-0 flex-wrap">
                    {/* Selector rapid camere */}
                    <div className="flex items-center gap-1.5 overflow-x-auto pb-0.5">
                      {cameras.map(c => {
                        const isSel = c.id === selectedCameraId;
                        return (
                          <button
                            key={c.id}
                            onClick={() => setSelectedCameraId(c.id)}
                            style={{
                              backgroundColor: isSel ? '#1976D2' : 'transparent',
                              color: isSel ? '#FFFFFF' : theme.textColor
                            }}
                            className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-all shrink-0 flex items-center gap-1.5 ${
                              isSel ? 'border-blue-500 shadow-sm' : 'border-slate-500/20 hover:bg-slate-500/10'
                            }`}
                          >
                            <span className={`w-2 h-2 rounded-full ${c.status === 'offline' ? 'bg-red-500' : 'bg-emerald-500'}`}></span>
                            <span>{c.code}</span>
                          </button>
                        );
                      })}
                    </div>

                    {/* Butoane Moduri (Standard, Split, Fullscreen) */}
                    <div className="flex items-center gap-1.5">
                      <div className="flex items-center bg-slate-500/10 rounded-lg p-0.5 border border-slate-500/20">
                        <button
                          onClick={() => setDisplayMode('standard')}
                          className={`px-2 py-1 rounded text-[11px] font-semibold flex items-center gap-1 ${
                            displayMode === 'standard' ? 'bg-blue-600 text-white' : 'text-slate-500'
                          }`}
                        >
                          <Icon name="layout-dashboard" size={12} />
                          <span>Standard</span>
                        </button>
                        <button
                          onClick={() => setDisplayMode('split')}
                          className={`px-2 py-1 rounded text-[11px] font-semibold flex items-center gap-1 ${
                            displayMode === 'split' ? 'bg-blue-600 text-white' : 'text-slate-500'
                          }`}
                        >
                          <Icon name="columns" size={12} />
                          <span>Split</span>
                        </button>
                      </div>

                      {/* Motor ON/OFF */}
                      <button
                        onClick={() => toggleEngine(activeCamera.id)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-mono font-bold flex items-center gap-1.5 shadow ${
                          activeCamera.engine_on ? 'bg-amber-500 text-slate-950 animate-pulse' : 'bg-slate-700 text-slate-200'
                        }`}
                      >
                        <Icon name="power" size={12} />
                        <span>MOTOR: {activeCamera.engine_on ? 'ON' : 'OFF'}</span>
                      </button>

                      {/* Full-Screen */}
                      <button
                        onClick={() => setDisplayMode('fullscreen')}
                        className="p-1.5 rounded-lg bg-slate-500/10 hover:bg-slate-500/20 border border-slate-500/20 text-slate-400"
                        title="Vizualizare Full-Screen"
                      >
                        <Icon name="maximize-2" size={14} />
                      </button>
                    </div>
                  </div>

                  {/* Player Video Restrâns */}
                  <div className="relative rounded-xl overflow-hidden bg-black border border-slate-700 shadow-md h-64 md:h-72 lg:h-[320px] max-h-[340px] shrink-0 flex items-center justify-center">
                    {isOffline ? (
                      <div className="text-center p-6 text-red-500 font-mono">
                        <Icon name="wifi-off" size={44} className="mx-auto mb-2 animate-bounce" />
                        <h3 className="text-xl font-black tracking-widest">SEMNAL PIERDUT</h3>
                        <p className="text-xs text-slate-400 mt-1">CAMERA {activeCamera.id.toUpperCase()} ESTE MOMENTAN OFFLINE</p>
                      </div>
                    ) : (
                      <div className={`w-full h-full bg-gradient-to-br ${activeCamera.previewBg} relative flex items-center justify-center`}>
                        <div className="text-center opacity-30 select-none">
                          <Icon name="video" size={56} className="mx-auto mb-1 text-slate-300" />
                          <p className="font-mono font-bold text-white text-sm">{activeCamera.name.toUpperCase()}</p>
                          <p className="font-mono text-[11px] text-slate-300">STREAM ADNOTAT • {activeCamera.fps} FPS</p>
                        </div>

                        {activeCamera.boxes.map(box => (
                          <div
                            key={box.id}
                            style={{ top: box.coords.top, left: box.coords.left, width: box.coords.width, height: box.coords.height }}
                            className="absolute border-2 border-red-500 bg-red-500/15 rounded flex flex-col justify-between p-1.5 shadow"
                          >
                            <span className="bg-red-600 text-white font-mono text-[9px] font-bold px-1.5 py-0.5 rounded shadow self-start">
                              {box.label}
                            </span>
                          </div>
                        ))}

                        {/* Indicator LIVE strict lângă fluxul video conform cerinței */}
                        <div className="absolute top-2.5 left-2.5 flex items-center gap-2 bg-black/80 px-2.5 py-1 rounded-lg text-[10px] font-mono text-white border border-white/10 shadow">
                          <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                          <span className="font-bold text-red-400">LIVE REC</span>
                          <span className="text-slate-400">|</span>
                          <span>{activeCamera.resolution}</span>
                        </div>

                        {/* Banner jos cu detalii cameră afișate sub denumire */}
                        <div className="absolute bottom-2.5 left-2.5 right-2.5 bg-black/75 backdrop-blur px-3 py-1.5 rounded-lg border border-white/10 flex items-center justify-between text-xs">
                          <div>
                            <p className="font-bold text-white text-xs leading-none">{activeCamera.name}</p>
                            <p className="text-[10px] text-slate-300 font-normal mt-0.5 leading-none">{activeCamera.subtitle}</p>
                          </div>
                          <span className="text-[10px] font-mono text-slate-400">FPS: {activeCamera.fps}</span>
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {/* SIDEBAR DREAPTA: INCIDENTE */}
                <div
                  style={{ backgroundColor: theme.panelBg, borderColor: theme.panelBorder }}
                  className={`rounded-xl border p-3 flex flex-col shadow-sm shrink-0 overflow-hidden ${
                    displayMode === 'split' ? 'w-full max-h-72' : 'w-full lg:w-96'
                  }`}
                >
                  <div className="flex items-center justify-between pb-2 border-b border-slate-500/15 shrink-0">
                    <h2 className="font-bold text-xs uppercase tracking-wider flex items-center gap-1.5 text-slate-800 dark:text-slate-200">
                      <Icon name="shield-alert" size={15} className="text-red-500" />
                      Incidente în Timp Real
                    </h2>
                    <span className="text-xs font-mono font-bold px-2 py-0.5 rounded-full bg-blue-600 text-white">
                      {filteredIncidents.length}
                    </span>
                  </div>

                  {/* Filtre */}
                  <div className="flex gap-1 my-2 shrink-0">
                    {['all', 'critical', 'warning'].map(k => (
                      <button
                        key={k}
                        onClick={() => setFilterSeverity(k)}
                        className={`flex-1 py-1 text-[11px] font-bold rounded-lg transition-colors text-center ${
                          filterSeverity === k ? 'bg-blue-600 text-white' : 'bg-slate-500/10 text-slate-500'
                        }`}
                      >
                        {k === 'all' ? 'Toate' : k === 'critical' ? 'Critice' : 'Avertismente'}
                      </button>
                    ))}
                  </div>

                  {/* Lista Carduri Incidente */}
                  <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                    {filteredIncidents.length === 0 ? (
                      <div className="p-5 rounded-xl text-center text-xs opacity-60">
                        Niciun incident găsit.
                      </div>
                    ) : (
                      filteredIncidents.map(inc => {
                        const isCrit = inc.severity === 'critical';
                        return (
                          <div
                            key={inc.id}
                            style={{ backgroundColor: theme.cardBg }}
                            className={`p-3 rounded-xl border transition-all space-y-2 shadow-sm ${
                              isCrit ? 'border-red-400/40 hover:border-red-500' : 'border-amber-400/40 hover:border-amber-500'
                            }`}
                          >
                            <div className="flex items-center justify-between">
                              <span
                                className={`text-[9px] font-black uppercase px-1.5 py-0.5 rounded border ${
                                  isCrit
                                    ? 'bg-red-50 text-red-700 border-red-200 dark:bg-red-950/40 dark:text-red-400 dark:border-red-800'
                                    : 'bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-950/40 dark:text-amber-400 dark:border-amber-800'
                                }`}
                              >
                                {isCrit ? 'CRITICAL / PERICOL' : 'WARNING / ATENȚIE'}
                              </span>
                              <span className="text-[10px] font-mono text-slate-400">{inc.id}</span>
                            </div>

                            <div>
                              <p className="font-bold text-xs leading-tight text-slate-900 dark:text-slate-100">{inc.title}</p>
                              <p className="text-[10px] text-slate-500 dark:text-slate-400 font-mono mt-0.5">{inc.cameraName} • {inc.detectedAt}</p>
                            </div>

                            {/* Bara Confidence Gradient Roșu - Portocaliu - Verde */}
                            <div className="space-y-1">
                              <div className="flex justify-between text-[10px] font-mono">
                                <span className="opacity-70">Încredere AI:</span>
                                <span className="font-bold">{inc.confidenceCadre}</span>
                              </div>
                              <div className="w-full h-1.5 rounded-full bg-black/20 overflow-hidden relative">
                                <div
                                  style={{ width: `${inc.confidence}%` }}
                                  className="h-full bg-gradient-to-r from-red-600 via-amber-400 to-emerald-500 rounded-full"
                                ></div>
                              </div>
                            </div>

                            {/* Reasoning XAI */}
                            <div className="p-2 rounded-lg bg-slate-500/10 text-[11px] space-y-1">
                              <p className="text-slate-600 dark:text-slate-300 leading-snug">{inc.reasoning}</p>
                              <p className="text-[10px] text-amber-600 dark:text-amber-400 font-semibold">{inc.actionSuggested}</p>
                            </div>

                            {/* Buton Confirmă (Ack) - Verde Industrial */}
                            <div className="pt-1 flex items-center justify-end border-t border-slate-500/10">
                              <button
                                onClick={() => handleAcknowledge(inc.id)}
                                className="px-3 py-1 rounded-lg text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 flex items-center gap-1 shadow-sm transition-colors"
                              >
                                <Icon name="check" size={13} />
                                <span>Confirmă (Ack)</span>
                              </button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
